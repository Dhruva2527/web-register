<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechSpark 2026 - Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>TechSpark 2026</h1>
      <p>Two-day workshop on Web Development &middot; Register your seat</p>
    </header>

    <form id="regForm" novalidate>
      <div class="row">
        <div class="field">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" placeholder="e.g. Dhruva K H">
          <span class="error"></span>
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" placeholder="you@example.com">
          <span class="error"></span>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="phone">Phone *</label>
          <input type="text" id="phone" name="phone" placeholder="10-digit number" maxlength="10">
          <span class="error"></span>
        </div>
        <div class="field">
          <label for="dob">Date of Birth *</label>
          <input type="date" id="dob" name="dob">
          <span class="error"></span>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="course">Branch *</label>
          <select id="course" name="course">
            <option value="">-- Select --</option>
            <option>Computer Science</option>
            <option>Information Science</option>
            <option>Electronics &amp; Communication</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>Other</option>
          </select>
          <span class="error"></span>
        </div>
        <div class="field">
          <label>Gender *</label>
          <div class="inline">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
          <span class="error"></span>
        </div>
      </div>

      <div class="field">
        <label>Interests * (pick at least one)</label>
        <div class="inline">
          <label><input type="checkbox" name="interests[]" value="Frontend"> Frontend</label>
          <label><input type="checkbox" name="interests[]" value="Backend"> Backend</label>
          <label><input type="checkbox" name="interests[]" value="Databases"> Databases</label>
          <label><input type="checkbox" name="interests[]" value="UI/UX"> UI/UX</label>
        </div>
        <span class="error"></span>
      </div>

      <div class="field">
        <label for="message">Why do you want to attend?</label>
        <textarea id="message" name="message" rows="3" maxlength="300"></textarea>
        <small><span id="count">0</span>/300</small>
      </div>

      <button type="submit" id="submitBtn">Register</button>
    </form>

    <section id="result" class="hidden"></section>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
